<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>使用文档 · CAEventManager</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/css/docs.css">
</head>
<body>

<div class="docs-shell" id="docsShell">

  <aside class="docs-side" id="docsSide">
    <div class="docs-brand">
      <span class="docs-logo" aria-hidden="true"></span>
      <span class="docs-brand-text">使用文档</span>
      <span class="docs-ver">v{{VERSION}}</span>
    </div>
    <nav class="docs-tree" id="docsTree" aria-label="文档目录"></nav>
  </aside>

  <main class="docs-main">
    <header class="docs-bar">
      <button class="docs-menu" id="docsMenu" type="button"
              title="目录" aria-label="目录">
        <svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor"
             stroke-width="1.6" stroke-linecap="round">
          <path d="M3.4 5.6h13.2M3.4 10h13.2M3.4 14.4h8.4"/>
        </svg>
      </button>
      <span class="docs-crumb" id="docsCrumb"></span>
      <span class="docs-acts">
        <a class="docs-act" id="docsBack" href="panel" title="回到控制台"
           aria-label="回到控制台">
          <svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor"
               stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8.4 5.2L3.6 10l4.8 4.8M3.6 10h9.2a4 4 0 0 1 0 8h-1.2"/>
          </svg>
        </a>
        <button class="docs-act" id="docsTheme" type="button"
                title="切换深浅色" aria-label="切换深浅色">
          <svg class="i-sun" viewBox="0 0 20 20" aria-hidden="true" fill="none"
               stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <circle cx="10" cy="10" r="3.4"/>
            <path d="M10 2.6v1.8M10 15.6v1.8M2.6 10h1.8M15.6 10h1.8M4.8 4.8l1.3 1.3M13.9 13.9l1.3 1.3M15.2 4.8l-1.3 1.3M6.1 13.9l-1.3 1.3"/>
          </svg>
          <svg class="i-moon" viewBox="0 0 20 20" aria-hidden="true" fill="none"
               stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
               stroke-linejoin="round">
            <path d="M16.4 12.4A6.8 6.8 0 0 1 7.6 3.6a6.8 6.8 0 1 0 8.8 8.8Z"/>
          </svg>
        </button>
      </span>
    </header>

    <article class="docs-body">
      <div class="docs-spin" id="docsSpin" aria-hidden="true"></div>
      <div class="docs-article md" id="docsArticle"></div>
      <p class="docs-empty" id="docsEmpty" hidden>左边选一篇看看。</p>
    </article>
  </main>

  <div class="docs-scrim" id="docsScrim" hidden></div>
</div>

<script src="assets/js/markdown.js"></script>
<script src="assets/js/docs.js"></script>
</body>
</html>
