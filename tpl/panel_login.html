<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>登录 · CAEventManager</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="panel_static/panel.css">
</head>
<body>
<div class="auth-wrap">
  <form class="auth-card" id="loginForm" autocomplete="off" onsubmit="return false">
    <div class="brand">CAEventManager</div>
    <h1>登录</h1>

    <div class="field">
      <label for="username">用户名</label>
      <input id="username" type="text" name="username" autocomplete="username" autofocus>
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input id="password" type="password" name="password" autocomplete="current-password">
    </div>

    <div class="err" id="err"></div>
    <button class="btn primary block" type="submit" id="go">登录</button>

    <div class="auth-foot">没有账号？<a href="register">去注册</a></div>
  </form>

  <p class="hint" style="margin-top:16px;text-align:center">
    参加抽奖并不需要注册账户
  </p>
  <div class="site-foot" style="border:0;margin-top:4px;max-width:400px">{{FOOTER}}</div>
</div>
<script src="panel_static/common.js"></script>
<script src="panel_static/login.js"></script>
</body>
</html>
