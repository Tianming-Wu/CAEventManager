<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>登录 · {{TITLE}}</title>
{{FAVICON}}
<link rel="stylesheet" href="static/app.css">
</head>
<body>
<div class="login-wrap" style="flex-direction:column">
  <form class="login-card" id="loginForm" autocomplete="off">
    <h1>抽奖后台</h1>
    <div class="login-err" id="err"></div>
    <div class="field">
      <label for="user">账号</label>
      <input id="user" name="user" type="text" autocomplete="username" autofocus>
    </div>
    <div class="field">
      <label for="pass">密码</label>
      <input id="pass" name="pass" type="password" autocomplete="current-password">
    </div>
    <button class="btn primary block" type="submit" id="go">登录</button>
  </form>
  <div class="site-foot" style="border:0;margin-top:16px">xlottery project | Powered with ❤ by Tianming &amp; Deepseek ❤🐋</div>
</div>
<script src="static/common.js"></script>
<script src="static/login.js"></script>
</body>
</html>
