<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>重设密码 · CAEventManager</title>
{{FAVICON}}
<link rel="stylesheet" href="assets/css/panel.css">
</head>
<body>
<div class="auth-wrap">
  <form class="auth-card" id="resetForm" autocomplete="off" onsubmit="return false">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 3h12a2 2 0 0 1 2 2v3a2 2 0 0 0 0 4v3a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-3a2 2 0 0 0 0-4V5a2 2 0 0 1 2-2Z"/>
          <path d="m7 10 2 2 4-4"/>
        </svg>
      </span>
      CAEventManager
    </div>
    <h1>重设密码</h1>
    <p class="page-sub" id="resetWho">这个账号还在用临时密码，先给自己设一个新密码。</p>

    <div class="field">
      <label for="newPass">新密码</label>
      <input id="newPass" type="password" autocomplete="new-password" placeholder="至少 8 位">
    </div>
    <div class="field">
      <label for="newPass2">再输一次</label>
      <input id="newPass2" type="password" autocomplete="new-password" placeholder="两次要一样">
    </div>

    <div class="err" id="err"></div>
    <button class="btn primary block" type="submit" id="go">保存并进入</button>

    <div class="auth-foot"><a href="logout" id="signOut">换个账号登录</a></div>
  </form>

  <p class="hint" style="margin-top:16px;text-align:center">
    临时密码是管理员发给你的一次性口令，设好新密码之后它就作废了
  </p>
  <div class="site-foot" style="border:0;margin-top:4px;max-width:400px">{{FOOTER}}</div>
</div>
<script src="assets/js/markdown.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/reset.js"></script>
</body>
</html>
