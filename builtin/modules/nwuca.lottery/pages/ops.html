<!-- 模块自己的页签：平台按 pages 声明注入到活动后台 -->
  <section id="tab-ops">
    <div class="panel">
      <!-- Honeypot: browsers autofill the first login-shaped field they meet, so
           give them one that is hidden and never read. Without it Edge repeatedly
           drops the saved account name into the roster search box. -->
      <div
        aria-hidden="true"
        style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap"
      >
        <input type="text" name="username" autocomplete="username" tabindex="-1">
        <input type="password" name="password" autocomplete="current-password" tabindex="-1">
      </div>
      <div class="searchbox">
        <span class="icon">🔍</span>
        <input
          id="q"
          type="search"
          name="admin_roster_filter"
          placeholder="输入姓名 / 拼音 / 首字母 / 学号的一部分…"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          data-form-type="other"
          aria-autocomplete="none"
        >
      </div>
      <div class="kbdhint">
        <kbd>Enter</kbd> 完成下一个步骤 ·
        <kbd>↑</kbd><kbd>↓</kbd> 选择 ·
        <kbd>Shift</kbd>+<kbd>1</kbd>/<kbd>2</kbd>/<kbd>3</kbd> 指定步骤 ·
        <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Z</kbd> 撤销最后一步(需解锁) ·
        <kbd>Esc</kbd> 清空 · 加 <kbd>#</kbd> 按身份与状态筛
      </div>
      <p class="taghint" id="tagHint" hidden></p>
      <div class="hits" id="hits"></div>
    </div>

    <div class="panel">
      <div class="row" style="margin-bottom:10px">
        <h2 style="margin:0">名单</h2>
        <div class="chips" id="filters">
          <button class="btn sm" data-filter="all">全部</button>
          <button class="btn sm" data-filter="in">已签到</button>
          <button class="btn sm" data-filter="out">未签到</button>
          <button class="btn sm" data-filter="todo">待完成任务</button>
          <button class="btn sm" data-filter="done">全部完成</button>
          <button class="btn sm" data-filter="zero">无奖票</button>
        </div>
        <div class="spacer"></div>
        <button class="btn sm ghost" id="refreshBtn">刷新</button>
      </div>
      <div class="tblwrap" style="max-height:calc(100vh - 380px)">
        <table class="tbl" id="rosterTable">
          <thead>
            <tr>
              <th>姓名</th><th>学号</th><th>班级</th>
              <th>签到</th><th>任务一</th><th>任务二</th>
              <th>奖票</th><th class="right">操作</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <p class="note" id="rosterNote"></p>
    </div>
  </section>

  <!-- ======================= 名单 ======================= -->
