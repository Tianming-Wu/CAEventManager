<!-- 模块自己的页签：平台按 pages 声明注入到活动后台 -->
  <section id="tab-config" class="hidden">
    <div class="panel">
      <h2>公示页</h2>
      <div class="row">
        <label class="switch" style="cursor:pointer">
          <input type="checkbox" id="setShowQuestions"><span class="track"></span>显示提问
        </label>
      </div>
      <p class="note">关掉之后公示页只显示议程，提问只留在这一页。</p>
      <div class="row" style="margin-top:12px">
        <button class="btn primary" id="saveTalkBtn" type="button">保存</button>
        <span class="note" id="talkNote"></span>
      </div>
    </div>
  </section>
