<!-- 模块自己的页签：平台按 pages 声明注入到活动后台 -->
  <section id="tab-questions" class="hidden">
    <div class="panel">
      <div class="row" style="margin-bottom:10px">
        <h2 style="margin:0">提问</h2>
        <span class="chip" id="questionCount"></span>
        <div class="spacer"></div>
      </div>
      <div class="tblwrap" style="max-height:60vh">
        <table class="tbl" id="questionTable">
          <thead><tr>
            <th>谁</th><th>内容</th><th>记下的时间</th>
            <th>状态</th><th class="right">操作</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <h2>记一条提问</h2>
      <div class="row">
        <div class="field" style="min-width:130px">
          <label for="askWho">谁问的</label>
          <input id="askWho" type="text" maxlength="40" placeholder="留空为匿名" autocomplete="off">
        </div>
        <div class="field" style="flex:2;min-width:220px">
          <label for="askText">内容</label>
          <input id="askText" type="text" maxlength="200" autocomplete="off">
        </div>
        <button class="btn primary" id="askBtn" type="button">记下</button>
      </div>
    </div>
  </section>

  <!-- ======================= 设置 ======================= -->
